    <path d="M20 52Q26 49 32 52Q38 49 44 52V58Q38 55 32 58Q26 55 20 58Z"/>
    <path d="M32 52V58" stroke-width="1.4"/>
    <!-- Перо -->
    <path d="M45 28C51 33 46 42 38 46C38 38 40 32 45 28Z"/>
    <path d="M38 46L44 33" stroke-width="1.4"/>
  </g>
  <!-- Искра знания -->
  <path class="f" d="M24 27L25.2 30.8L29 32L25.2 33.2L24 37L22.8 33.2L19 32L22.8 30.8Z" fill="#14532d"/>
