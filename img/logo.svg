<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ИЛШ">
  <title>ИЛШ — Исламская лингвистическая школа</title>
  <style>.s{stroke:#14532d}.f{fill:#14532d}@media (prefers-color-scheme:dark){.s{stroke:#7fd6a0}.f{fill:#7fd6a0}}</style>
  <g class="s" fill="none" stroke="#14532d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Арка-портал: вершина уходит за верхний край -->
    <path d="M8 64V30C8 14 20 4 32 -4C44 4 56 14 56 30V64"/>
